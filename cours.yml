server:
  port: 8082

spring:
  profiles:
    active: "prod"
  application:
    name: cours
  datasource:
    url: 'jdbc:h2:mem:coursdb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: false
    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: '*'



build:
  version: 1.0

author:
     name: "Moetez Cours on GITHUB Updated at 10:30"
